<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9822b"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="660" rx="16" fill="#f6f8fa"/>

  <!-- 第一行 -->
  <g filter="url(#s)">
    <rect x="60" y="70" width="300" height="130" rx="12" fill="#fff" stroke="#d0d7de"/>
    <rect x="450" y="70" width="300" height="130" rx="12" fill="#fff" stroke="#d0d7de"/>
    <rect x="840" y="70" width="300" height="130" rx="12" fill="#eef4ff" stroke="#4a78c2" stroke-width="1.5"/>
  </g>
  <text x="210" y="122" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2328">在聊天里说一句</text>
  <text x="210" y="160" text-anchor="middle" font-size="17" fill="#57606a">飞书 · 钉钉 · 企业微信 · 网页</text>
  <text x="600" y="122" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2328">AI 大脑</text>
  <text x="600" y="160" text-anchor="middle" font-size="17" fill="#57606a">理解问题 · 规划排查 · 判断风险</text>
  <text x="990" y="122" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2328">MCP 网关</text>
  <text x="990" y="160" text-anchor="middle" font-size="17" fill="#57606a">查权限 · 拦危险命令 · 限速</text>
  <path d="M362 135H446" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M752 135H836" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 第二行 -->
  <g filter="url(#s)">
    <rect x="60" y="340" width="300" height="130" rx="12" fill="#fff" stroke="#d0d7de"/>
    <rect x="450" y="340" width="300" height="130" rx="12" fill="#fff" stroke="#d0d7de"/>
    <rect x="840" y="340" width="300" height="130" rx="12" fill="#fff4e6" stroke="#d9822b" stroke-width="1.5"/>
  </g>
  <text x="210" y="392" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2328">结论和证据</text>
  <text x="210" y="430" text-anchor="middle" font-size="17" fill="#57606a">回到你发消息的地方</text>
  <text x="600" y="392" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2328">机器上的 Agent</text>
  <text x="600" y="430" text-anchor="middle" font-size="17" fill="#57606a">主动连回来 · 在沙箱里执行</text>
  <text x="990" y="392" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2328">先找人审批</text>
  <text x="990" y="430" text-anchor="middle" font-size="17" fill="#57606a">高危一人批 · 最危险两人批</text>

  <!-- 网关分流 -->
  <path d="M990 202V336" stroke="#d9822b" stroke-width="2" marker-end="url(#o)"/>
  <rect x="1002" y="252" width="56" height="30" rx="15" fill="#d9822b"/>
  <text x="1030" y="273" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">高危</text>
  <path d="M920 202C880 260 720 280 660 336" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="712" y="236" width="118" height="30" rx="15" fill="#fff" stroke="#d0d7de"/>
  <text x="771" y="257" text-anchor="middle" font-size="16" fill="#1f2328">只读 / 低危</text>
  <path d="M838 405H754" stroke="#d9822b" stroke-width="2" marker-end="url(#o)"/>
  <text x="796" y="395" text-anchor="middle" font-size="16" fill="#d9822b">同意</text>
  <path d="M448 405H364" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 审计 -->
  <rect x="60" y="540" width="1080" height="64" rx="12" fill="#fff" stroke="#d0d7de" stroke-dasharray="6 5"/>
  <text x="600" y="580" text-anchor="middle" font-size="19" fill="#57606a"><tspan font-weight="600" fill="#1f2328">全程留审计记录</tspan>　谁在什么时候让 AI 做了什么，日志只能追加、不能改</text>
</svg>
